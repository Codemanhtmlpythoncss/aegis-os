# Aegis "quiet on the wire" tuning — make the host less noisy / less fingerprintable.
# Perfect invisibility is impossible; this reduces what a passive LAN observer sees.

# Don't advertise uptime / reduce TCP stack fingerprint.
net.ipv4.tcp_timestamps=0

# Don't answer pings or broadcast probes (quieter host discovery).
net.ipv4.icmp_echo_ignore_all=1
net.ipv4.icmp_echo_ignore_broadcasts=1

# Minimal ARP footprint: only answer for addresses on the incoming interface.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2

# Belt-and-braces IPv6 off (also disabled on the kernel cmdline) — IPv6 commonly
# leaks around a v4-only Tor transproxy.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1

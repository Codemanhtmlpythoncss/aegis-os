## Aegis i2pd config — lightweight defaults (the "not resource-stealing" goal).
## Full reference: https://i2pd.readthedocs.io
## NOTE: i2pd's parser rejects an inline comment on a [section] header line
## (it errors "invalid line '[http] ; ...'" and refuses to start), so every
## comment here lives on its own line.

ipv4 = true
ipv6 = false
# don't relay others' traffic by default (saves CPU/bandwidth)
notransit = true
floodfill = false

[limits]
# no transit tunnels -> minimal resource use
transittunnels = 0

# the i2pd web console (I2P Manager embeds this)
[http]
enabled = true
address = 127.0.0.1
port = 7070

# browser HTTP proxy for eepsites (.i2p) + clearnet via an I2P outproxy
[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444
# Outproxy carries clearnet (HTTP/S) requests out of I2P. StormyCloud runs a
# public one; change it in the I2P panel. Only HTTP/S clearnet is supported.
outproxy = http://exit.stormycloud.i2p

# SOCKS proxy for I2P-aware apps
[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447

# needed by some I2P apps (e.g. torrent); off unless wanted
[sam]
enabled = false

## Aegis i2pd config — lightweight defaults (the "not resource-stealing" goal).
## Full reference: https://i2pd.readthedocs.io

ipv4 = true
ipv6 = false
notransit = true          ; don't relay others' traffic by default (saves CPU/bandwidth)
floodfill = false

[limits]
transittunnels = 0        ; no transit tunnels -> minimal resource use

[http]                    ; the i2pd web console (I2P Manager embeds this)
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]               ; browser HTTP proxy for eepsites (.i2p)
enabled = true
address = 127.0.0.1
port = 4444

[socksproxy]              ; SOCKS proxy for I2P-aware apps
enabled = true
address = 127.0.0.1
port = 4447

[sam]                     ; needed by some I2P apps (e.g. torrent); off unless wanted
enabled = false

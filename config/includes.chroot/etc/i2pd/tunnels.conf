## Aegis i2pd client/server tunnels.
## The I2P Manager app edits this file and restarts i2pd.
##
## Example: expose a local web server as an eepsite (uncomment & edit):
# [my-eepsite]
# type = http
# host = 127.0.0.1
# port = 8080
# keys = my-eepsite.dat
##
## Example: client tunnel to an I2P IRC server (uncomment & edit):
# [irc-ilita]
# type = client
# address = 127.0.0.1
# port = 6668
# destination = irc.ilita.i2p
# destinationport = 6667

## ACTIVE — Aegis I2P IRC client tunnel. HexChat's preconfigured "I2P (ilita)"
## network connects to 127.0.0.1:6668, which i2pd forwards to the ilita IRC
## server inside I2P. (First connection waits for I2P to bootstrap.)
[irc-ilita]
type = client
address = 127.0.0.1
port = 6668
destination = irc.ilita.i2p
destinationport = 6667
keepaliveinterval = 30

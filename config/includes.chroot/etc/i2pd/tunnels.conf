## Aegis i2pd client/server tunnels.
## The I2P Manager app edits this file and restarts i2pd.
##
## Example: expose a local web server as an eepsite (uncomment & edit):
# [my-eepsite]
# type = http
# host = 127.0.0.1
# port = 8080
# keys = my-eepsite.dat
##
## Example: client tunnel to an I2P IRC server (uncomment & edit):
# [irc-ilita]
# type = client
# address = 127.0.0.1
# port = 6668
# destination = irc.ilita.i2p
# destinationport = 6667

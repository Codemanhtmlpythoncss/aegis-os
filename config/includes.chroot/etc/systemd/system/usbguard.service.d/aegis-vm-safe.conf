[Unit]
# Environments with no USB controller (many VMs, some servers) have no
# /sys/bus/usb, so usbguard-daemon exits 1 ("loadFiles: /sys/bus/usb/devices:
# No such file or directory") and systemd restart-thrashes it until
# start-limit-hit. Skip cleanly there; on real hardware with USB it runs as
# normal (BadUSB / juice-jacking protection).
ConditionPathExists=/sys/bus/usb/devices

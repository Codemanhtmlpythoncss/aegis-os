# Aegis stealth networking (NetworkManager).
[connection]
# Never send our hostname in DHCP requests (a common identity leak).
dhcp-send-hostname=false
# No per-connection mDNS responder.
connection.mdns=0
connection.llmnr=0

[connectivity]
# No "am I online?" phone-home.
enabled=false

[main]
# Ignore IPv6 entirely at the NM layer too.

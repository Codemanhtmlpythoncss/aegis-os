# Aegis MAC randomization (NetworkManager).
# Randomizes Wi-Fi MAC during scans AND assigns a random MAC per connection.
# Toggle at runtime with: aegis-mac-spoof {on|off|status}
[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
# 'random' = new MAC every connection; 'stable' = per-network stable pseudo-random.
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random

[main]
# Don't let NM write a persistent machine-unique duid.
dhcp=internal

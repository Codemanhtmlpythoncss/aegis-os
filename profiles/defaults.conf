# Aegis base defaults for the LIVE image. build.sh writes these into
# /etc/aegis/build.env so the chroot hooks can read them.
# NOTE: user-facing choices (Tor/I2P, browser, DE, MAC, Kali, encryption) are made
# in the INSTALLER now — not here. These are only the live-image baseline.

AEGIS_NAME="Aegis"
AEGIS_SUITE="trixie"

# Live-session baseline (the installer can change all of these for the target):
AEGIS_DEFAULT_NETMODE="tor"   # live session boots routing through Tor, fail-closed
AEGIS_MAC_SPOOF="yes"
AEGIS_USBGUARD="yes"
AEGIS_RAM_WIPE="yes"
AEGIS_HARDENED_MALLOC="yes"
AEGIS_BROWSER="firefox"       # firefox-esr ships in the live base; installer can swap

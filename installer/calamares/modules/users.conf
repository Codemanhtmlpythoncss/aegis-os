# Aegis users module — ask for as little identifying info as possible.
# You give a username and a password. That's it:
#   * no real name required (the field is optional and can stay blank),
#   * no separate root password (root is locked; you use sudo),
#   * a generic "aegis" hostname is pre-filled (change it if you want),
#   * weak/short passwords are allowed (your call, not the installer's).
---
defaultGroups:
    - cdrom
    - audio
    - video
    - plugdev
    - netdev
    - sudo
    - bluetooth
    - lp
    - scanner

autologinUser: ""
sudoersGroup: sudo
userShell: /bin/bash
availableShells: /bin/bash

# No separate admin account — root is locked, the first user has sudo.
setRootPassword: false
doReusePassword: false

# Privacy: don't demand a real name or a "strong" password.
fullNameRequired: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    minLength: -1
    maxLength: -1

# Generic, non-identifying hostname, pre-filled so you needn't think about it.
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "aegis"
    forbiddenNames:
        - localhost
        - localhost.localdomain

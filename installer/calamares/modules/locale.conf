# Aegis locale module — no phone-home. The stock installer asks a geolocation
# service where you are to preselect a timezone; for a privacy OS we DON'T do
# that. geoipUrl is empty (no lookup), and we default to UTC so a fresh install
# leaks nothing about your location. Change the timezone on the locale page if
# you want to.
---
region: "Etc"
zone: "UTC"
geoipUrl: ""

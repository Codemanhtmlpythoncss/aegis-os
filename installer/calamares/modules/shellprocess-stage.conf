# Copy the Aegis options file collected before install into the target root.
# dontChroot: runs on the live host; ${ROOT} = the target mount point.
---
dontChroot: true
timeout: 60
script:
  - command: "/bin/sh -c 'install -D -m0644 /etc/calamares/aegis-options.env ${ROOT}/etc/aegis/install-options.env'"
    timeout: 60

# Aegis Calamares settings.
# The Aegis-specific options (Tor/I2P, browser, DE, MAC, Kali, hardening) are
# collected by `aegis-installer` BEFORE Calamares runs and written to
# /etc/calamares/aegis-options.env, so Calamares itself needs no custom UI module
# (no PythonQt dependency). Two shellprocess steps then act on them:
#   stage  -> copies the options file into the target
#   apply  -> runs /usr/local/bin/aegis-apply inside the target
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/aarch64-linux-gnu/calamares/modules ]

instances:
- id: stage
  module: shellprocess
  config: shellprocess-stage.conf
- id: apply
  module: shellprocess
  config: shellprocess-apply.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition          # offers "Encrypt system" (LUKS) — full-disk encryption
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs           # clones the hardened Aegis base onto the target
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@stage
  - shellprocess@apply # <-- Aegis options applied here
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: aegis
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true

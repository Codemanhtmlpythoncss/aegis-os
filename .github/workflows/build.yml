name: build-iso

# Builds every edition x arch: {live, installer} x {amd64, arm64} = 4 ISOs.
#   live      = amnesic USB; wipes RAM & powers off if the stick is pulled (Tails-style)
#   installer = boots straight into the installer (install to an SSD)
# Build runs in a Debian trixie container (Debian's own live-build). A separate
# host-runner job attaches the ISOs to a Release on tags (v*).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: live,      arch: amd64, runner: ubuntu-latest }
          - { edition: live,      arch: arm64, runner: ubuntu-24.04-arm }
          - { edition: installer, arch: amd64, runner: ubuntu-latest }
          - { edition: installer, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies (Debian live-build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Show disk space
        run: df -h . || true

      - name: Build Aegis (${{ matrix.edition }} / ${{ matrix.arch }})
        run: ./build.sh --arch ${{ matrix.arch }} --edition ${{ matrix.edition }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.edition }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  boot-test:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: live,      arch: amd64, runner: ubuntu-latest }
          - { edition: live,      arch: arm64, runner: ubuntu-24.04-arm }
          - { edition: installer, arch: amd64, runner: ubuntu-latest }
          - { edition: installer, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: aegis-${{ matrix.edition }}-${{ matrix.arch }}
          path: iso

      - name: Boot smoke-test (${{ matrix.edition }} / ${{ matrix.arch }})
        run: |
          set -eu
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ISO="$(ls iso/*.iso | head -n1)"
          echo "Booting $ISO"
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else echo "no KVM access -> TCG (slower)"; ACCEL="-cpu max"; fi
          if [ "${{ matrix.arch }}" = amd64 ]; then
            qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -cdrom "$ISO" \
              -nic user,model=virtio-net-pci \
              -display none -serial file:serial.log -no-reboot &
          else
            qemu-system-aarch64 $ACCEL -machine virt -m 2048 -smp 2 \
              -bios /usr/share/AAVMF/AAVMF_CODE.fd -cdrom "$ISO" \
              -nic user,model=virtio-net-pci \
              -display none -serial file:serial.log -no-reboot &
          fi
          QPID=$!
          OK=0
          for _ in $(seq 1 90); do
            sleep 4
            if grep -qE "login:|Reached target .*(Multi-User|Graphical)" serial.log 2>/dev/null; then OK=1; break; fi
            kill -0 "$QPID" 2>/dev/null || { echo "QEMU exited early"; break; }
          done
          kill "$QPID" 2>/dev/null || true
          echo "---- serial.log tail ----"; tail -n 50 serial.log 2>/dev/null || true
          if [ "$OK" = 1 ] && grep -qE "Failed to start (NetworkManager|aegis-netmode|tor@default|systemd-user-sessions|i2pd)" serial.log 2>/dev/null; then
            echo "CRITICAL SERVICE(S) FAILED:"; grep -E "Failed to start (NetworkManager|aegis-netmode|tor@default|systemd-user-sessions|i2pd)" serial.log | sort -u
            OK=0
          fi
          if [ "$OK" = 1 ]; then echo "BOOT SMOKE-TEST PASSED"; else echo "BOOT SMOKE-TEST FAILED"; exit 1; fi

  # Runs on the HOST runner (gh CLI present here, unlike the Debian container).
  release:
    needs: [ build, boot-test ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built ISOs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish ISOs to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          FILES="$(find dist -type f \( -name '*.iso' -o -name '*.sha256' \))"
          echo "Attaching:"; echo "$FILES"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Aegis $GITHUB_REF_NAME" \
            --notes "Automated Aegis build ($GITHUB_REF_NAME). Editions: live (amnesic, wipe-on-removal) and installer; for amd64 and arm64." \
            || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $FILES --clobber

name: build-iso

# Builds BOTH architectures natively — amd64 on the standard runner, arm64 on
# GitHub's arm64 runner — so there's no slow/fragile qemu emulation. (ISOs can't
# be built on macOS/Windows; CI or a Debian host does it.)
# Push a tag like v1.0 to also publish the ISOs to a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools

      - name: Build Aegis (${{ matrix.arch }})
        run: sudo ./build.sh --arch ${{ matrix.arch }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Aegis ${GITHUB_REF_NAME}" \
            --notes "Automated Aegis build (${GITHUB_REF_NAME})." 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber

name: build-iso

# Builds every edition x arch: {live, installer} x {amd64, arm64} = 4 ISOs.
#   live      = amnesic USB; wipes RAM & powers off if the stick is pulled (Tails-style)
#   installer = boots straight into the installer (install to an SSD)
# Build runs in a Debian trixie container (Debian's own live-build). A separate
# host-runner job attaches the ISOs to a Release on tags (v*).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: live,      arch: amd64, runner: ubuntu-latest }
          - { edition: live,      arch: arm64, runner: ubuntu-24.04-arm }
          - { edition: installer, arch: amd64, runner: ubuntu-latest }
          - { edition: installer, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies (Debian live-build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            build-essential debhelper devscripts dpkg-dev fakeroot \
            git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Show disk space
        run: df -h . || true

      - name: Build Aegis (${{ matrix.edition }} / ${{ matrix.arch }})
        run: ./build.sh --arch ${{ matrix.arch }} --edition ${{ matrix.edition }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.edition }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  boot-test:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: live,      arch: amd64, runner: ubuntu-latest }
          - { edition: live,      arch: arm64, runner: ubuntu-24.04-arm }
          - { edition: installer, arch: amd64, runner: ubuntu-latest }
          - { edition: installer, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 ovmf

      - uses: actions/download-artifact@v4
        with:
          name: aegis-${{ matrix.edition }}-${{ matrix.arch }}
          path: iso

      - name: Boot smoke-test (${{ matrix.edition }} / ${{ matrix.arch }})
        run: |
          set -eu
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ISO="$(ls iso/*.iso | head -n1)"
          echo "Booting $ISO"
          # --- Payload integrity: the ISO MUST contain the aegis helper scripts.
          # A stray unanchored 'local/' in .gitignore once excluded all of
          # config/includes.chroot/usr/local/ from git, so the CI image shipped
          # without them and every aegis-* service died 'not found'. Guard it.
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq squashfs-tools libarchive-tools >/dev/null 2>&1 || true
          rm -rf _iso && mkdir _iso
          bsdtar -C _iso -xf "$ISO" live/filesystem.squashfs 2>/dev/null || true
          if [ -f _iso/live/filesystem.squashfs ]; then
            MISSING=""
            # live-build includes helpers (still in /usr/local/bin)
            for s in aegis-hostname aegis-apply aegis-mac-spoof aegis-ramwipe aegis-tordate aegis-media-watchdog aegis-dispvm; do
              unsquashfs -ll _iso/live/filesystem.squashfs "usr/local/bin/$s" 2>/dev/null | grep -q "usr/local/bin/$s" || MISSING="$MISSING local:$s"
            done
            # packaged backend (aegis-firewall now ships via the .deb at /usr/sbin)
            for s in aegis-firewall aegis-route aegis-newnym aegis-reroute aegis-tor-port; do
              unsquashfs -ll _iso/live/filesystem.squashfs "usr/sbin/$s" 2>/dev/null | grep -q "usr/sbin/$s" || MISSING="$MISSING pkg:$s"
            done
            # friendly layer (GTK apps) must be installed from the .deb's
            for s in aegis-control aegis-welcome aegis-tor-connection; do
              unsquashfs -ll _iso/live/filesystem.squashfs "usr/bin/$s" 2>/dev/null | grep -q "usr/bin/$s" || MISSING="$MISSING pkg:$s"
            done
            # screensaver: the Aegis image, the skel config, and the saver binary
            unsquashfs -ll _iso/live/filesystem.squashfs "usr/share/backgrounds/aegis/aegis-wallpaper.png" 2>/dev/null | grep -q "aegis-wallpaper.png" || MISSING="$MISSING asset:wallpaper"
            unsquashfs -ll _iso/live/filesystem.squashfs "etc/skel/.xscreensaver" 2>/dev/null | grep -q ".xscreensaver" || MISSING="$MISSING asset:xscreensaver-cfg"
            unsquashfs -ll _iso/live/filesystem.squashfs "usr/bin/xscreensaver" 2>/dev/null | grep -q "usr/bin/xscreensaver" || MISSING="$MISSING pkg:xscreensaver"
            # animated spinning-shield banner
            unsquashfs -ll _iso/live/filesystem.squashfs "usr/bin/aegis-fetch" 2>/dev/null | grep -q "usr/bin/aegis-fetch" || MISSING="$MISSING pkg:aegis-fetch"
            # desktop-aware wallpaper applier + i3 config (so the background is the
            # same Aegis image under XFCE/GNOME/KDE/i3, not each DE's own default)
            unsquashfs -ll _iso/live/filesystem.squashfs "usr/lib/aegis/aegis-set-wallpaper" 2>/dev/null | grep -q "aegis-set-wallpaper" || MISSING="$MISSING pkg:aegis-set-wallpaper"
            unsquashfs -ll _iso/live/filesystem.squashfs "etc/skel/.config/i3/config" 2>/dev/null | grep -q "i3/config" || MISSING="$MISSING asset:i3-config"
            if [ -n "$MISSING" ]; then echo "PAYLOAD CHECK FAILED — missing from image:$MISSING"; exit 1; fi
            echo "payload check OK: aegis helpers + packaged friendly layer present in image"
          else
            echo "WARN: could not extract squashfs for payload check (continuing to boot test)"
          fi
          rm -rf _iso
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else echo "no KVM access -> TCG (slower)"; ACCEL="-cpu max"; fi
          if [ "${{ matrix.arch }}" = amd64 ]; then
            qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -cdrom "$ISO" \
              -nic user,model=virtio-net-pci \
              -display none -serial file:serial.log -no-reboot &
          else
            qemu-system-aarch64 $ACCEL -machine virt -m 2048 -smp 2 \
              -bios /usr/share/AAVMF/AAVMF_CODE.fd -cdrom "$ISO" \
              -nic user,model=virtio-net-pci \
              -display none -serial file:serial.log -no-reboot &
          fi
          QPID=$!
          OK=0
          for _ in $(seq 1 90); do
            sleep 4
            if grep -qE "login:|Reached target .*(Multi-User|Graphical)" serial.log 2>/dev/null; then OK=1; break; fi
            kill -0 "$QPID" 2>/dev/null || { echo "QEMU exited early"; break; }
          done
          kill "$QPID" 2>/dev/null || true
          echo "---- serial.log tail ----"; tail -n 50 serial.log 2>/dev/null || true
          # Fail on any deterministic critical-service failure. aegis-[a-z-]+ catches
          # the whole family (hostname/netmode/liveuser/media-watchdog) so a missing
          # script can never pass green again. (tor@default/i2pd are network-timing
          # dependent in CI, so they're not hard-fails here.)
          CRIT="Failed to start (NetworkManager|systemd-user-sessions|aegis-[a-z-]+)"
          if [ "$OK" = 1 ] && grep -qE "$CRIT" serial.log 2>/dev/null; then
            echo "CRITICAL SERVICE(S) FAILED:"; grep -E "$CRIT" serial.log | sort -u
            OK=0
          fi
          if [ "$OK" = 1 ]; then echo "BOOT SMOKE-TEST PASSED"; else echo "BOOT SMOKE-TEST FAILED"; exit 1; fi

  # Runs on the HOST runner (gh CLI present here, unlike the Debian container).
  release:
    needs: [ build, boot-test ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built ISOs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish ISOs to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          FILES="$(find dist -type f \( -name '*.iso' -o -name '*.sha256' \))"
          echo "Attaching:"; echo "$FILES"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Aegis $GITHUB_REF_NAME" \
            --notes "Automated Aegis build ($GITHUB_REF_NAME). Editions: live (amnesic, wipe-on-removal) and installer; for amd64 and arm64." \
            || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $FILES --clobber

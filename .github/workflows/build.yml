name: build-iso

# Builds BOTH architectures natively (amd64 on the standard runner, arm64 on
# GitHub's arm64 runner), inside a Debian trixie container so we use Debian's own
# live-build. A SEPARATE release job (on the host runner, where `gh` exists)
# attaches the ISOs to a GitHub Release when you push a tag like v1.0.
# ISOs can't be built on macOS/Windows.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies (Debian live-build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Show disk space
        run: df -h . || true

      - name: Build Aegis (${{ matrix.arch }})
        run: ./build.sh --arch ${{ matrix.arch }}   # already root in the container

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  # Runs on the HOST runner (gh CLI is present here, unlike the Debian container).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built ISOs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish ISOs to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          FILES="$(find dist -type f \( -name '*.iso' -o -name '*.sha256' \))"
          echo "Attaching:"; echo "$FILES"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Aegis $GITHUB_REF_NAME" \
            --notes "Automated Aegis build ($GITHUB_REF_NAME). ISOs for amd64 and arm64 are attached below." \
            || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $FILES --clobber

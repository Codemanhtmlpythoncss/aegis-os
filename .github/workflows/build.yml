name: build-iso

# Builds BOTH architectures natively (amd64 on the standard runner, arm64 on
# GitHub's arm64 runner). The build runs inside a Debian trixie container so we
# use Debian's own live-build — Ubuntu's live-build is an old fork that rejects
# the options an Aegis (Debian) image needs. Privileged container = live-build
# can do its chroot bind-mounts. ISOs can't be built on macOS/Windows.
# Push a tag like v1.0 to also publish the ISOs to a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies (Debian live-build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            git ca-certificates
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Show disk space
        run: df -h . || true

      - name: Build Aegis (${{ matrix.arch }})
        run: ./build.sh --arch ${{ matrix.arch }}   # already root in the container

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Aegis ${GITHUB_REF_NAME}" \
            --notes "Automated Aegis build (${GITHUB_REF_NAME})." 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber

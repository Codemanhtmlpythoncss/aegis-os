name: build-iso

# Builds BOTH architectures on GitHub's Linux runners (you can't build an ISO on
# macOS/Windows). amd64 builds natively; arm64 cross-builds via qemu-user-static.
# Push a tag like v1.0 to also publish the ISOs to a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            qemu-user-static binfmt-support

      - name: Build Aegis (${{ matrix.arch }})
        run: sudo ./build.sh --arch ${{ matrix.arch }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          mv aegis-*.iso aegis-*.iso.sha256 out/ 2>/dev/null || true
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Aegis ${GITHUB_REF_NAME}" \
            --notes "Automated Aegis build (${GITHUB_REF_NAME})." 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber

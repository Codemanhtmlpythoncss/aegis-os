      <stop offset="0" stop-color="#1b2332"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>

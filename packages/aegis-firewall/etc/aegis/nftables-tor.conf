#!/usr/sbin/nft -f
# Aegis fail-closed transparent Tor firewall.
# EVERYTHING is routed through Tor. Nothing reaches the network directly except:
#   (a) Tor itself (TOR_UID),
#   (b) apps the user explicitly launches clearnet via the aegis-clearnet group,
#   (c) destinations the user added to the bypass sets (aegis-route / Split-tunnel).
# There is deliberately NO blanket "LAN" bypass: a 10.0.0.0/8 bypass used to
# swallow Tor's AutomapHostsOnResolve range (10.192.0.0/10), so resolved sites
# went out direct and nothing loaded. aegis-firewall rewrites TOR_UID and
# CLEARNET_GID to the live ids before loading this file.

flush ruleset

define TOR_UID      = 109
define CLEARNET_GID = 700
define TRANS_PORT   = 9040
define DNS_PORT     = 5353

table inet aegis {
    # Split-tunnel: destinations to send DIRECT (managed by aegis-route / the
    # Split-tunnel app, populated from dnsmasq for bypassed domains).
    set bypass4 { type ipv4_addr; flags interval; }
    set bypass6 { type ipv6_addr; flags interval; }

    chain prerouting { type nat hook prerouting priority -100; }

    chain output_nat {
        type nat hook output priority -100;
        # Tor's own traffic and loopback: never touched.
        meta skuid $TOR_UID accept
        oif "lo" accept
        # Split-tunnel: apps launched in the clearnet group go out direct.
        meta skgid $CLEARNET_GID accept
        # Split-tunnel: user-chosen destinations go out direct.
        ip  daddr @bypass4 accept
        ip6 daddr @bypass6 accept
        # All DNS -> Tor's DNSPort (returns 10.192/10 automap addresses).
        meta l4proto { tcp, udp } th dport 53 redirect to :$DNS_PORT
        # Everything else TCP (incl. the 10.192/10 automap) -> Tor's TransPort.
        meta l4proto tcp redirect to :$TRANS_PORT
    }

    chain output_filter {
        type filter hook output priority 0; policy drop;   # <-- FAIL CLOSED
        ct state established,related accept
        meta skuid $TOR_UID accept
        oif "lo" accept
        meta skgid $CLEARNET_GID accept
        ip  daddr @bypass4 accept
        ip6 daddr @bypass6 accept
        # Allow the just-redirected DNS / TransPort traffic (now to 127.0.0.1).
        ip daddr 127.0.0.1 tcp dport { $TRANS_PORT, $DNS_PORT } accept
        ip daddr 127.0.0.1 udp dport $DNS_PORT accept
        # Anything else would be a clearnet leak: drop it (logged).
        log prefix "aegis-blocked-leak: " level warn
        reject
    }

    chain input   { type filter hook input priority 0; policy drop;
                    ct state established,related accept; iif "lo" accept; }
    chain forward { type filter hook forward priority 0; policy drop; }
}

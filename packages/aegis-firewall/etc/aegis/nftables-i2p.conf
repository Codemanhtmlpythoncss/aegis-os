#!/usr/sbin/nft -f
# Aegis fail-closed I2P firewall: ONLY i2pd may reach the network ("everything
# through I2P"). Apps reach the network through i2pd's proxies on loopback
# (HTTP 127.0.0.1:4444 / SOCKS 127.0.0.1:4447); .i2p destinations work natively,
# clearnet is carried by i2pd's HTTP outproxy. aegis-firewall rewrites I2PD_UID
# and CLEARNET_GID to the live ids before loading, and sets the system proxy.
#
# NOTE: I2P is an internal overlay. Unlike Tor there is no general transparent
# clearnet routing — clearnet works only for proxy-aware apps via the outproxy.

flush ruleset

define I2PD_UID     = 108
define CLEARNET_GID = 700

table inet aegis {
    set bypass4 { type ipv4_addr; flags interval; }
    set bypass6 { type ipv6_addr; flags interval; }

    chain output_filter {
        type filter hook output priority 0; policy drop;   # <-- FAIL CLOSED
        ct state established,related accept
        # Only i2pd may egress; everything else must go through its proxies.
        meta skuid $I2PD_UID accept
        oif "lo" accept
        # Split-tunnel escapes.
        meta skgid $CLEARNET_GID accept
        ip  daddr @bypass4 accept
        ip6 daddr @bypass6 accept
        log prefix "aegis-blocked-leak: " level warn
        reject
    }

    chain input   { type filter hook input priority 0; policy drop;
                    ct state established,related accept; iif "lo" accept; }
    chain forward { type filter hook forward priority 0; policy drop; }
}
